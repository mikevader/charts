#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/mikevader/charts/tree/main/charts/library/common/values.yaml
#

image:
  # -- image repository
  repository: jellyfin/jellyfin
  # @default -- chart.appVersion
  tag:
  # -- image pull policy
  pullPolicy: IfNotPresent

# -- environment variables. See [jellyfin docs](https://jellyfin.org/docs/general/administration/configuration/) for more details.
# @default -- See below
env:
  # -- Set the container timezone
  TZ: UTC

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  main:
    primary: true
    ports:
      http:
        port: 8096
  discovery:
    enabled: false
    type: NodePort
    ports:
      discovery:
        enabled: true
        port: 7359
        protocol: UDP
        targetPort: 7359
    externalTrafficPolicy: Local
  dnla:
    enabled: false
    type: NodePort
    ports:
      dnla:
        enabled: true
        port: 1900
        protocol: UDP
        targetPort: 1900
    externalTrafficPolicy: Local

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false

# -- Enable devices to be discoverable
hostNetwork: false

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  config:
    enabled: false
    mountPath: /config

  cache:
    enabled: false
    mountPath: /cache

# -- Configure the Security Context for the Pod
podSecurityContext: {}
  # runAsUser: 568
  # runAsGroup: 568
  # fsGroup: 568
  # supplementalGroups:
  # - 44
  # - 109

# -- Configure the resource requests and/or limits for the Pod
resources: {}
  # requests:
  #   cpu: 200m
  #   memory: 256Mi
  # limits:
  #   memory: 4096Mi

