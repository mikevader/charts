#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/mikevader/charts/tree/main/charts/library/common/values.yaml
#

image:
  # -- image repository
  repository: felddy/foundryvtt
  # -- image pull policy
  pullPolicy: IfNotPresent
  # -- image tag
  tag:

strategy:
  type: Recreate

# -- Pod security context. Since v13 the image runs as the non-root user `node` (1000:1000)
# and no longer changes the ownership of `/data`. `fsGroup` makes mounted volumes writable,
# including volumes written by chart versions < 4.0.0 (owned by 421:421).
# Volume types that ignore `fsGroup` (e.g. hostPath, most NFS setups) need a one-time `chown -R 1000:1000`.
# @default -- See values.yaml
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# -- environment variables. See [image docs](https://github.com/felddy/foundryvtt-docker#environment-variables) for more details.
# @default -- See below
env:
  # -- Set the container timezone
  TZ: UTC

  # -- Account password for foundryvtt.com. Required for downloading an application distribution.
  FOUNDRY_PASSWORD:
  # -- Account username or email address for foundryvtt.com. Required for downloading an application distribution.
  FOUNDRY_USERNAME:
  # -- S3 pre-signed URL generate from the user's profile. Required for downloading an application distribution.
  FOUNDRY_RELEASE_URL:
  # -- Admin password to be applied at startup. If omitted the admin password will be cleared. May be set using secrets.
  FOUNDRY_ADMIN_KEY:
  # -- Opt in (`true`) or out (`false`) of Foundry VTT telemetry. Set it explicitly to avoid the prompt on every start.
  FOUNDRY_TELEMETRY:


# -- Configures service settings for the chart. Normally this does not need to be modified.
# @default -- See values.yaml
service:
  main:
    ports:
      http:
        port: 30000

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
# Foundryvtt is hardcoded to use /data for its persistance for config
persistence:
  data:
    enabled: false
    emptyDir:
      enabled: false
    mountPath: /data
