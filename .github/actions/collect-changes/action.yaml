name: "Collect changes"
description: "Collects and stores changed files/charts"

outputs:
  changesDetected:
    description: "Whether or not changes to charts have been detected"
    value: ${{ steps.filter.outputs.addedOrModified }}
  addedOrModifiedFiles:
    description: "A list of the files changed"
    value: ${{ steps.filter.outputs.addedOrModified_files }}
  addedOrModifiedCharts:
    description: "A list of the charts changed"
    value: ${{ steps.filter-charts.outputs.addedOrModified }}
  helperChartsChanged:
    description: "Whether or not files under helper-charts/ (e.g. the common library tests) have been changed"
    value: ${{ steps.filter.outputs.helperCharts }}

runs:
  using: "composite"
  steps:
    - name: Collect changed files
      uses: dorny/paths-filter@v4
      id: filter
      with:
        list-files: shell
        # 'every': a file has to match all rules of a filter, so the negated rule excludes archived charts
        predicate-quantifier: every
        filters: |
          addedOrModified:
            - added|modified: 'charts/*/**'
            - added|modified: '!charts/archived/**'
          helperCharts:
            - added|modified: 'helper-charts/**'

    - name: Collect changed charts
      if: |
        steps.filter.outputs.addedOrModified == 'true'
      id: filter-charts
      shell: bash
      run: |
        CHARTS=()
        PATHS=(${{ steps.filter.outputs.addedOrModified_files }})
        # Get only the chart paths
        for CHARTPATH in "${PATHS[@]}"
        do
          IFS='/' read -r -a path_parts <<< "${CHARTPATH}"
          CHARTS+=("${path_parts[1]}/${path_parts[2]}")
        done

        # Remove duplicates
        CHARTS=( `printf "%s\n" "${CHARTS[@]}" | sort -u` )
        # Set output to changed charts
        printf "addedOrModified=%s\n" "${CHARTS[*]}" >> "$GITHUB_OUTPUT"
