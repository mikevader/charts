remote: origin
target-branch: master
helm-extra-args: --timeout 600s
chart-dirs:
  - charts/stable
  - charts/library
# ct matches excluded charts by directory name, not by path
excluded-charts:
  - foundryvtt # complex to download foundryvtt binaries (credentials required)
  - heimdall
  - app-of-apps # render Argo CD and External Secrets CRs only; covered by helm-unittest
  - app-of-apps-bootstrap
chart-repos:
  - bitnami=https://charts.bitnami.com/bitnami
  - mikevader=https://mikevader.github.io/charts
  - jetstack=https://charts.jetstack.io
