name: "Charts: Test"

on:
  workflow_call:
    inputs:
      checkoutCommit:
        required: true
        type: string
      chartChangesDetected:
        required: true
        type: string
      helperChartsChanged:
        description: "Whether files under helper-charts/ changed; runs the common library tests"
        required: false
        type: string
        default: "false"

jobs:
  generate-matrix:
    name: Generate matrices for unit tests and install
    runs-on: ubuntu-latest
    outputs:
      # Unit tests run for every changed chart; the install test skips the excluded-charts
      # of ct-install.yaml (e.g. charts that need credentials or CRDs k3d does not have).
      unittestMatrix: |
        {
          "chart": ${{ steps.list-changed.outputs.unittestCharts }}
        }
      unittestDetected: ${{ steps.list-changed.outputs.unittestDetected }}
      installMatrix: |
        {
          "chart": ${{ steps.list-changed.outputs.installCharts }}
        }
      installDetected: ${{ steps.list-changed.outputs.installDetected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        if: inputs.chartChangesDetected == 'true' || inputs.helperChartsChanged == 'true'
        env:
          HELPER_CHARTS_CHANGED: ${{ inputs.helperChartsChanged }}
        run: |
          # ct-lint.yaml has no excluded-charts; ct list-changed skips the excluded-charts of ct-install.yaml
          for kind in unittest:.github/ct-lint.yaml install:.github/ct-install.yaml; do
            name="${kind%%:*}"
            config="${kind#*:}"
            CHARTS=$(ct list-changed --config "${config}")
            OUTPUT_JSON=$(echo "${CHARTS}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            # Changes under helper-charts/ (common library tests) run the library tests,
            # unless a library chart change already does.
            if [[ "${HELPER_CHARTS_CHANGED}" == "true" ]]; then
              OUTPUT_JSON=$(echo "${OUTPUT_JSON}" | jq -c 'if any(.[]; contains("library")) then . else . + ["helper-charts/common-test"] end')
            fi
            echo "${name}Charts=${OUTPUT_JSON}" >> "$GITHUB_OUTPUT"
            if [[ $(echo "${OUTPUT_JSON}" | jq -c '. | length') -gt 0 ]]; then
              echo "${name}Detected=true" >> "$GITHUB_OUTPUT"
            else
              echo "${name}Detected=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Detected changed charts (${name}): ${OUTPUT_JSON}"
          done

  unittest:
    needs:
      - generate-matrix
    if: needs.generate-matrix.outputs.unittestDetected == 'true'
    name: Run unit tests
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.unittestMatrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Prep Helm
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Run unit tests
        if: ${{ !(contains(matrix.chart, 'library') || startsWith(matrix.chart, 'helper-charts/')) }}
        run: helm unittest -f "tests/**/*_test.yaml" ${{ matrix.chart }}

      - name: Run library unit tests
        if: ${{ contains(matrix.chart, 'library') || startsWith(matrix.chart, 'helper-charts/') }}
        run: |
          helm dep update helper-charts/common-test
          helm unittest -f "tests/**/*_test.yaml" helper-charts/common-test

  unittest_success:
    needs:
      - generate-matrix
      - unittest
    if: |
      always()
    name: Unit tests successful
    runs-on: ubuntu-latest
    steps:
      - name: Check unit test matrix status
        if: ${{ (needs.generate-matrix.outputs.unittestDetected == 'true') && (needs.unittest.result != 'success') }}
        run: exit 1


  install-charts:
    needs:
      - unittest_success
      - generate-matrix
    if: needs.generate-matrix.outputs.installDetected == 'true'
    name: Install charts
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.installMatrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Create k3d cluster
        uses: nolar/setup-k3d-k3s@v1
        with:
          version: v1.36.2+k3s1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove node taints
        run: |
          kubectl taint --all=true nodes node.cloudprovider.kubernetes.io/uninitialized- || true

      - name: Run chart-testing (install)
        if: ${{ !(contains(matrix.chart, 'library') || startsWith(matrix.chart, 'helper-charts/')) }}
        run: ct install --config .github/ct-install.yaml --charts ${{ matrix.chart }}

      - name: Run library-chart-testing (install)
        if: ${{ contains(matrix.chart, 'library') || startsWith(matrix.chart, 'helper-charts/') }}
        run: ct install --config .github/ct-install-library.yaml --charts helper-charts/common-test

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  install_success:
    needs:
      - generate-matrix
      - install-charts
    if: |
      always()
    name: Install successful
    runs-on: ubuntu-latest
    steps:
      - name: Check install matrix status
        if: ${{ (needs.generate-matrix.outputs.installDetected == 'true') && (needs.install-charts.result != 'success') }}
        run: exit 1
