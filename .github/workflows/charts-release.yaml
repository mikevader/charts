name: "Charts: Release"

concurrency: helm-release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "charts/**"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.K8S_AT_HOME_TOKEN }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Install helm-docs
        run: | 
          wget -O /tmp/helm-docs.deb https://github.com/norwoodj/helm-docs/releases/download/v1.11.0/helm-docs_1.11.0_Linux_x86_64.deb
          sudo dpkg -i /tmp/helm-docs.deb

      - name: Collect changes
        id: collect-changes
        uses: ./.github/actions/collect-changes

      - name: Generate README for changed charts
        if: |
          steps.collect-changes.outputs.changesDetected == 'true'
        run: |
          CHARTS=(${{ steps.collect-changes.outputs.addedOrModifiedCharts }})
          for i in "${CHARTS[@]}"
          do
              IFS='/' read -r -a chart_parts <<< "$i"
              if [ -f "charts/${chart_parts[0]}"/"${chart_parts[1]}/Chart.yaml" ]; then
                ./.github/scripts/gen-helm-docs.sh "${chart_parts[0]}" "${chart_parts[1]}"
              fi
          done

      - name: Create commit
        id: create-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: charts/**
          commit_message: "chore: Auto-update chart README [skip ci]"
          commit_user_name: mikevader[bot]
          commit_user_email: mikevader[bot]@users.noreply.github.com
          commit_author: mikevader[bot] <mikevader[bot]@users.noreply.github.com>

      - name: Save commit hash
        id: save-commit-hash
        run: |
          if [ "${{ steps.create-commit.outputs.changes_detected || 'unknown' }}" == "true" ]; then
            echo "commit_hash=${{ steps.create-commit.outputs.commit_hash }}" >> "$GITHUB_OUTPUT"
          else
            echo "commit_hash=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.K8S_AT_HOME_TOKEN }}
          ref: ${{ steps.save-commit-hash.outputs.commit_hash }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "mikevader[bot]"
          git config user.email "mikevader[bot]@users.noreply.github.com"

      # Archived charts are no longer released. Their published versions stay in the repo index.
      # chart-releaser skips chart directories that do not exist, so drop them from this checkout.
      - name: Exclude archived charts
        run: rm -rf charts/archived

      # GitHub's generated notes list every PR between two tags, including ones for other charts.
      # Build chart-scoped notes for every chart whose version has not been released yet; chart-releaser
      # reads them from the packaged chart via CR_RELEASE_NOTES_FILE.
      - name: Generate chart-scoped release notes
        run: |
          for chart in charts/*/*/; do
            chart="${chart%/}"
            [ -f "${chart}/Chart.yaml" ] || continue
            tag="$(yq '.name' "${chart}/Chart.yaml")-$(yq '.version' "${chart}/Chart.yaml")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              continue
            fi
            ./.github/scripts/gen-release-notes.sh "${chart}"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        with:
          charts_dir: charts/*
        env:
          CR_TOKEN: "${{ secrets.K8S_AT_HOME_TOKEN }}"
          CR_SKIP_EXISTING: "true"
          CR_GENERATE_RELEASE_NOTES: "false"
          CR_RELEASE_NOTES_FILE: RELEASE-NOTES.md

  generate-summary:
    name: Auto-generate charts summary
    runs-on: ubuntu-24.04
    needs:
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.K8S_AT_HOME_TOKEN }}
          ref: master
          fetch-depth: 0

      - name: Install yq
        uses: chrisdickinson/setup-yq@latest
        with:
          yq-version: v4.9.3

      - name: Run script
        run: |
          ./hack/gen-chart-summary.sh

      - name: Create Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          push_options: --force
          commit_message: Auto-generate chart summary [no ci]
          commit_user_name: mikevader[bot]
          commit_user_email: mikevader[bot]@users.noreply.github.com
          commit_author: mikevader[bot] <mikevader[bot]@users.noreply.github.com>
          file_pattern: charts/README.md
